apiVersion: apps/v1
kind: Deployment
metadata: 
  name: backend
  namespace: yfc
spec: 
  replicas: 2
  selector:
    matchLabels: 
      app: backend
  template: 
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: yfc-backend:v3
          imagePullPolicy: IfNotPresent
          ports: 
            - containerPort: 5001
          envFrom: 
            - secretRef: 
                name: backend-env
          readinessProbe: 
            httpGet: 
              path: /api/health 
              port: 5001
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 15

